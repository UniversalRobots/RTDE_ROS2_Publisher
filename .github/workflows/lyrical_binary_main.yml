name: Lyrical Binary Main
on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    # Run every morning to detect flakiness and broken dependencies
    - cron: '17 6 * * *'

jobs:
  lyrical_binary_main:
    uses: ./.github/workflows/reusable_ici.yml
    with:
      ros_distro: lyrical
      ros_repo: main
      ref_for_scheduled_build: main
