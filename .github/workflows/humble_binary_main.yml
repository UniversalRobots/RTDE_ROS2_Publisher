name: Humble Binary Main
on:
  workflow_dispatch:
  pull_request:
    branches:
      - jazzy
  push:
    branches:
      - jazzy
  schedule:
    # Run every morning to detect flakiness and broken dependencies
    - cron: '17 6 * * *'

jobs:
  humble_binary_main:
    uses: ./.github/workflows/reusable_ici.yml
    with:
      ros_distro: humble
      ros_repo: main
      ref_for_scheduled_build: jazzy
